[project]
name = "uv-workspace"
version = "0.1.0"
description = "An example of uv workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
test = [
    "ruff >= 0.8.1",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "factory-boy>=3.3.0",
]

[tool.uv.sources]
root-lib = { workspace = true }

[tool.uv.workspace]
members = ["packages/*", "server", "."]

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
