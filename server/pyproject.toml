[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = { file = "README.adoc", content-type = "text/x-rst" }
authors = [
    { name = "lawyerance", email = "lawyerance@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.0",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.49.0",
    #    "web",
]

[project.scripts]
server = "server:main"

[tool.uv.sources]
#web = { workspace = true }

[build-system]
requires = [ "hatchling>=1.21.0" ]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/external", "src/fastapi_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers"]
markers = [
    "unit: Unit tests (fast, isolated, no external dependencies)",
    "api: API endpoint tests (uses FastAPI TestClient)",
]
